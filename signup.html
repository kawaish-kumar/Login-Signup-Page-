<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="box">
        <h2>Sign Up</h2>

        <input class="form-control mb-3" placeholder="Name">

        <button class="btn btn-primary w-100">Sign Up</button>

        <p>Already have an account?
            <a href="index.html">Login</a>
        </p>
    </div>
</div>

</body>
</html>
